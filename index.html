<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special for You ❤️</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
    text-align: center;
    overflow: hidden;
  }
  .container {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  img {
    max-width: 90%;
    max-height: 70vh;
    border-radius: 10px;
    transition: opacity 1s ease-in-out;
  }
  .hidden {
    opacity: 0;
    pointer-events: none;
    position: absolute;
  }
  button {
    margin-top: 20px;
    padding: 12px 20px;
    font-size: 18px;
    background: red;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
  }
  #noBtn {
    background: gray;
    position: absolute;
  }
  #message {
    margin-top: 20px;
    font-size: 18px;
    max-width: 90%;
    line-height: 1.5;
    white-space: pre-line;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }
</style>
</head>
<body>

<div class="container">
  <!-- First Screen -->
  <div id="screen1">
    <img src="first.jpg" alt="Nice hands">
    <br>
    <button onclick="showSecond()">Yes ❤️</button>
    <button id="noBtn" onmouseover="moveNo()">No 😢</button>
  </div>

  <!-- Second Screen -->
  <div id="screen2" class="hidden">
    <img src="second.jpg" alt="I love you">
    <div id="message"></div>
  </div>
</div>

<!-- Audio -->
<audio id="bgMusic" preload="auto" loop>
  <source src="yennaan-seivan.mp3" type="audio/mpeg">
</audio>

<script>
const text = "Before, whenever I saw a girl I felt attracted instantly. But you… you were different. I wasn’t drawn to you right away, yet over time, something deeper grew. After months, it turned into love—the first real love I’ve ever felt. You will always have a special place in my heart ❤️";

function showSecond() {
  document.getElementById("screen1").classList.add("hidden");
  const screen2 = document.getElementById("screen2");
  screen2.classList.remove("hidden");

  // Play music in loop
  const audio = document.getElementById("bgMusic");
  try { audio.play(); } catch(e) { console.warn("Autoplay blocked, will play on user interaction."); }

  setTimeout(() => {
    typeMessage(text);
  }, 1000);
}

function typeMessage(message) {
  const msgElem = document.getElementById("message");
  msgElem.textContent = "";
  msgElem.style.opacity = 1;

  let i = 0;
  function typing() {
    if (i < message.length) {
      msgElem.textContent += message.charAt(i);
      i++;
      setTimeout(typing, 40);
    }
  }
  typing();
}

function moveNo() {
  const btn = document.getElementById("noBtn");
  const maxX = window.innerWidth - btn.clientWidth - 20;
  const maxY = window.innerHeight - btn.clientHeight - 20;
  const x = Math.random() * maxX;
  const y = Math.random() * maxY;
  btn.style.left = `${x}px`;
  btn.style.top = `${y}px`;
}
</script>

</body>
</html>
