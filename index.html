<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special for You ❤️</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
    background: #000;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1s ease-in-out;
  }
  .hidden {
    opacity: 0;
    pointer-events: none;
  }
  img {
    max-width: 90%;
    max-height: 60vh;
    border-radius: 12px;
    transition: all 1s ease-in-out;
  }
  button {
    margin-top: 20px;
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #yesBtn { background: #ff4e78; color: white; }
  #noBtn { background: gray; position: relative; }
  #message, #finalMessage {
    margin-top: 20px;
    font-size: 20px;
    max-width: 90%;
    line-height: 1.6;
    white-space: pre-line;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  /* Romantic backgrounds */
  #screen2 {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  }
  #screen3 {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb);
  }

  /* Floating hearts for screen 2 */
  .heart {
    position: absolute;
    bottom: -50px;
    color: rgba(255,255,255,0.7);
    font-size: 24px;
    animation: floatUp 6s linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
  }

  /* Sparkles for screen 3 */
  .sparkle {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: sparkleMove 4s linear infinite;
  }
  @keyframes sparkleMove {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
  }

  video {
    max-width: 80%;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255,255,255,0.8);
  }
</style>
</head>
<body>

<!-- Screen 1 -->
<div class="screen" id="screen1" style="background:linear-gradient(135deg,#fbc2eb,#a6c1ee)">
  <img src="first.jpg" alt="Nice hands">
  <button id="yesBtn">Yes ❤️</button>
  <button id="noBtn">No 😢</button>
</div>

<!-- Screen 2 -->
<div class="screen hidden" id="screen2">
  <div id="hearts-container"></div>
  <img src="second.jpg" alt="I love you" style="box-shadow:0 0 30px rgba(255,255,255,0.8)">
  <div id="message"></div>
</div>

<!-- Screen 3 -->
<div class="screen hidden" id="screen3">
  <div id="sparkles-container"></div>
  <video src="images.mp4" autoplay loop muted playsinline></video>
  <div id="finalMessage">
    If you need time, I will respect and wait.  
    If you are not interested, I will respect your decision and we can be friends.  
    But you will always have a special place in my heart ❤️
  </div>
</div>

<!-- Audio -->
<audio id="bgMusic" preload="auto" loop>
  <source src="yennaan-seivan.mp3" type="audio/mpeg">
</audio>

<script>
const text = "Before, whenever I saw a girl I felt attracted instantly. But you… you were different. I wasn’t drawn to you right away, yet over time, something deeper grew. After months, it turned into love—the first real love I’ve ever felt. You will always have a special place in my heart ❤️";

// Buttons
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

// Screens
const screen1 = document.getElementById('screen1');
const screen2 = document.getElementById('screen2');
const screen3 = document.getElementById('screen3');

yesBtn.addEventListener('click', showSecond);
noBtn.addEventListener('mouseover', moveNo);

function showSecond() {
  fadeSwitch(screen1, screen2);

  // Play music
  const audio = document.getElementById("bgMusic");
  try { audio.play(); } catch(e) { console.warn("Autoplay blocked", e); }

  // Hearts animation
  spawnHearts();

  // Start text typing
  setTimeout(() => {
    typeMessage(text, document.getElementById("message"), () => {
      // After typing finishes, go to screen 3
      setTimeout(() => fadeSwitch(screen2, screen3), 2000);
      spawnSparkles();
      document.getElementById("finalMessage").style.opacity = 1;
    });
  }, 1000);
}

function typeMessage(message, targetElem, callback) {
  targetElem.textContent = "";
  targetElem.style.opacity = 1;
  let i = 0;
  function typing() {
    if (i < message.length) {
      targetElem.textContent += message.charAt(i);
      i++;
      setTimeout(typing, 40);
    } else if (callback) callback();
  }
  typing();
}

function moveNo() {
  const maxX = window.innerWidth - noBtn.clientWidth - 20;
  const maxY = window.innerHeight - noBtn.clientHeight - 20;
  noBtn.style.position = "absolute";
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}

function fadeSwitch(hideElem, showElem) {
  hideElem.classList.add('hidden');
  setTimeout(() => {
    showElem.classList.remove('hidden');
  }, 1000);
}

function spawnHearts() {
  const container = document.getElementById("hearts-container");
  setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    heart.innerHTML = "❤️";
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 500);
}

function spawnSparkles() {
  const container = document.getElementById("sparkles-container");
  setInterval(() => {
    const sparkle = document.createElement("div");
    sparkle.classList.add("sparkle");
    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.width = sparkle.style.height = Math.random() * 5 + 3 + "px";
    container.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 4000);
  }, 200);
}
</script>

</body>
</html>
